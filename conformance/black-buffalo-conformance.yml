compliance_program:
  published: false
  note: >-
    No trust center, no SOC 2 / ISO 27001 / PCI attestation page and no compliance
    disclosures were found on blackbuffalo.com (probe-security-programs.py returned
    vdp=none trust=none on 2026-08-07). Card payments are handled by Shopify, whose
    compliance posture is Shopify's to publish, not Black Buffalo's. Deliberately NOT
    wired as a `Compliance` pointer.
regulatory_context:
  note: >-
    Recorded for accuracy, not scored. Black Buffalo sells nicotine products regulated in
    the United States as tobacco products by the FDA Center for Tobacco Products, and its
    own /agents.md forbids agents from making modified-risk, cessation or comparative
    health claims. That is a content-governance obligation carried in prose; there is no
    machine-readable expression of it on any of the three API surfaces.
