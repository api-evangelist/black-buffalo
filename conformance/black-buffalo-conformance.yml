generated: '2026-08-07'
method: probed
source: live probes of https://blackbuffalo.com on 2026-08-07
description: >-
  Which cross-cutting and industry standards the surfaces served from Black Buffalo's
  hosts actually conform to. Every `conforms: true` below is backed by a document fetched
  or a live response observed; every `false` is a probe that missed. Nothing is asserted
  from vendor documentation alone.
standards:
