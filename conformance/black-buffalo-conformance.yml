  conforms: true
  evidence: >-
    Full __schema introspection succeeded anonymously at
    https://blackbuffalo.com/api/2026-04/graphql.json (424 types, 35 query fields,
    41 mutations). SDL saved at graphql/black-buffalo-storefront.graphql.
- id: relay-cursor-connections
  conforms: true
  evidence: 28 *Connection types with edges/node/cursor plus PageInfo in the SDL.
- id: mcp
  conforms: true
  version: 'MCP protocol 2025-06-18 over JSON-RPC 2.0'
  evidence: >-
    POST initialize to https://blackbuffalo.com/api/ucp/mcp returned protocolVersion
    2025-06-18 and serverInfo {name: universal-commerce, version: 0.1.0}. tools/list
    returned 200 with 13 tools on that endpoint and 5 on https://blackbuffalo.com/api/mcp,
    each carrying a JSON Schema inputSchema.
- id: ucp
  conforms: true
  version: '2026-04-08'
  evidence: >-
    /.well-known/ucp returns a Universal Commerce Protocol merchant profile declaring
