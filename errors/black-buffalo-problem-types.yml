  - CUSTOMER_DISABLED
  - TOKEN_INVALID
  - NOT_FOUND
- name: MetafieldsSetUserError
  code_enum: MetafieldsSetUserErrorCode
  code_count: 10
  returned_by: [cartMetafieldsSet]
  representative_codes: [BLANK, INCLUSION, PRESENT, TOO_SHORT, TOO_LONG, INVALID_OWNER, INVALID_VALUE, INVALID_TYPE, APP_NOT_AUTHORIZED]
- name: MetafieldDeleteUserError
  code_enum: MetafieldDeleteErrorCode
  code_count: 3
  returned_by: [cartMetafieldDelete]
  representative_codes: [INVALID_OWNER, METAFIELD_DOES_NOT_EXIST, APP_NOT_AUTHORIZED]
- name: UserErrorsShopPayPaymentRequestSessionUserErrors
  returned_by: [shopPayPaymentRequestSessionCreate, shopPayPaymentRequestSessionSubmit]
- name: UserError
  note: The generic field/message pair; the base shape the typed errors specialise.
decline_codes:
  dedicated_reference_published: false
  nearest_equivalent: CompletionErrorCode
  note: >-
    Black Buffalo is a merchant, not a payment processor, so it publishes no decline-code
    reference of its own and errors/black-buffalo-decline-codes.yml is deliberately NOT
    emitted. The payment-outcome codes above (PAYMENT_CARD_DECLINED,
    PAYMENT_INSUFFICIENT_FUNDS, PAYMENT_CALL_ISSUER, PAYMENT_INVALID_CREDIT_CARD) are the
    only decline vocabulary exposed, and they come from the Shopify schema.
gaps:
- >-
  No error is documented anywhere on blackbuffalo.com in prose. /agents.md describes
  which surface to call but never what a failure looks like, so every code above had to
  be read out of the schema.
- >-
  MCP tool errors are returned inside HTTP 200 JSON-RPC bodies with no mapping published
  between JSON-RPC error codes and the GraphQL enums beneath them.
