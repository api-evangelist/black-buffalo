aid: black-buffalo
name: Black Buffalo
description: >-
  Black Buffalo Inc. is an American smokeless tobacco alternative company founded in 2015
  and headquartered in Chicago, Illinois, selling nicotine pouches, long cut dip and its
  nicotine-free ZERO line direct to adult consumers at blackbuffalo.com and through
  convenience and fuel retailers. Imperial Brands' U.S. subsidiary ITG Brands acquired the
  company in May 2026. Black Buffalo runs no developer program and publishes no OpenAPI,
  but its Shopify-hosted storefront exposes a substantial machine-readable surface from its
  own domain: an anonymously introspectable Storefront GraphQL API, TWO live Model Context
  Protocol servers whose tools/list both answer anonymously, a Universal Commerce Protocol
  merchant profile at /.well-known/ucp, OpenID Connect and RFC 8414 discovery for customer
  accounts, and a provider-authored /agents.md and /llms.txt that tell AI agents which
  surface to use, what claims they may not make about a regulated nicotine product, and
  that no agent may finalize payment without contemporaneous human approval.
