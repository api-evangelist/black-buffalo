apis:
- aid: black-buffalo:storefront-graphql
  name: Black Buffalo Storefront GraphQL API
  description: >-
    The Shopify Storefront GraphQL API as served from Black Buffalo's own domain.
    Introspection is anonymous — the full schema (424 types, 35 query fields, 41
    mutations, 28 Relay connections) was retrieved without a Storefront access token on
    2026-08-07. Covers the product catalog, collections, cart and checkout preparation,
    editorial content, store policies and customer accounts.
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://blackbuffalo.com/api/2026-04/graphql.json
  tags:
  - GraphQL
  - Ecommerce
  - Catalog
  - Cart
  properties:
  - type: GraphQL
    url: graphql/black-buffalo-storefront.graphql
  - type: GraphQLManifest
    url: graphql/black-buffalo-graphql.yml
  - type: DataModel
    url: data-model/black-buffalo-data-model.yml
- aid: black-buffalo:storefront-mcp
  name: Black Buffalo Storefront MCP Server
  description: >-
    A live Model Context Protocol server on Black Buffalo's storefront host. An anonymous
    JSON-RPC tools/list returned five tools with full JSON Schema input contracts —
    search_catalog, get_product_details, get_cart, update_cart and
    search_shop_policies_and_faqs.
  humanURL: https://blackbuffalo.com/agents.md
  baseURL: https://blackbuffalo.com/api/mcp
  tags:
  - MCP
  - Agents
  - Ecommerce
  properties:
  - type: MCPServer
    url: mcp/black-buffalo-mcp.yml
  - type: ToolCrosswalk
    url: mcp/black-buffalo-tool-crosswalk.yml
- aid: black-buffalo:ucp-commerce
  name: Black Buffalo UCP Agentic Commerce API
  description: >-
    Black Buffalo implements the Universal Commerce Protocol for agent-driven commerce.
    The merchant profile at /.well-known/ucp declares UCP 2026-04-08 and 2026-01-23, the
    dev.ucp.shopping MCP service endpoint, the cart / checkout / fulfillment / discount /
    order / catalog capabilities and two payment handlers (Google Pay and Shopify card).
    Unusually, this endpoint's tools/list answers ANONYMOUSLY — thirteen tools with full
    JSON Schema input contracts, spanning the whole cart-to-completed-order lifecycle.
    Checkout completion still requires contemporaneous buyer approval.
  humanURL: https://ucp.dev/2026-04-08/specification/overview/
  baseURL: https://blackbuffalo.com/api/ucp/mcp
  tags:
  - UCP
  - Agentic Commerce
  - MCP
  - Checkout
  properties:
  - type: MCPServer
    url: mcp/black-buffalo-mcp.yml
  - type: AgenticAccess
    url: agentic-access/black-buffalo-agentic-access.yml
